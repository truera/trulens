[build-system]
build-backend = "poetry.core.masonry.api"
requires = [
  "poetry-core",
]

[tool.poetry]
name = "trulens-apps-claude"
version = "2.14.0"
description = "Claude Code hook instrumentation plugin for TruLens."
authors = [
  "Snowflake Inc. <ml-observability-wg-dl@snowflake.com>",
]
license = "MIT"
readme = "README.md"
packages = [
  { include = "trulens" },
]
homepage = "https://trulens.org/"
repository = "https://github.com/truera/trulens"

[tool.poetry.dependencies]
python = "^3.9"
trulens-core = { version = "^2.0.0" }

[tool.poetry.group.dev.dependencies]
trulens-core = { path = "../../core" }

[tool.poetry.plugins."trulens.client_hooks"]
claude-code = "trulens.apps.claude:client_spec"
