parameters:
  # Off by default. Only the docs deploy reads the LFS-tracked images, and
  # fetching ~55 MB of them on every test job would spend the repository's LFS
  # bandwidth on files those jobs never open. Jobs that render or publish docs
  # must set this to true: without it the checkout leaves every image as a
  # pointer stub, and a build will copy those stubs into the site without
  # complaint.
  - name: lfs
    type: boolean
    default: false

  # Off by default. Only a job that pushes back to the repository -- gh-deploy
  # committing to gh-pages -- needs the checkout's credentials left on disk for
  # later steps.
  - name: persistCredentials
    type: boolean
    default: false

steps:
  - checkout: self
    clean: true
    lfs: ${{ parameters.lfs }}
    persistCredentials: ${{ parameters.persistCredentials }}

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python-version)'

  - bash: |
      echo "=== Disk space before cleanup ==="
      df -h
      echo ""
      echo "=== Removing large pre-installed packages ==="
      sudo rm -rf /usr/share/dotnet || true
      sudo rm -rf /usr/local/lib/android || true
      sudo rm -rf /opt/ghc || true
      sudo rm -rf /opt/hostedtoolcache/CodeQL || true
      echo ""
      echo "=== Clearing apt cache ==="
      sudo apt-get clean || true
      sudo rm -rf /var/lib/apt/lists/* || true
      echo ""
      echo "=== Disk space after cleanup ==="
      df -h
    displayName: Free disk space

  - task: Cache@2
    inputs:
      key: 'pip | "$(python-version)" | poetry.lock'
      restoreKeys: |
        pip | "$(python-version)"
      path: $(Pipeline.Workspace)/.pip
    displayName: Cache pip packages

  - bash: |
      # Install poetry
      curl -sSL https://install.python-poetry.org | python3 - --version 1.8.5

      # Show python version
      echo "Using $(python --version) ($(which python))"
      poetry config virtualenvs.create false

      # NOTE: workaround for langchain typecheck error
      # https://github.com/truera/trulens/issues/1308
      PIP_CACHE_DIR=$(Pipeline.Workspace)/.pip poetry run pip install pip==24.1.2

      poetry run python --version
      poetry run pip --version
    displayName: Env Setup
