parameters:
  # Off by default. Only the docs deploy reads the LFS-tracked images, and
  # fetching ~55 MB of them on every test job would spend the repository's LFS
  # bandwidth on files those jobs never open. Jobs that render or publish docs
  # must set this to true: without it the checkout leaves every image as a
  # pointer stub, and a build will copy those stubs into the site without
  # complaint.
  - name: lfs
    type: boolean
    default: false

  # Off by default. Only a job that pushes back to the repository -- gh-deploy
  # committing to gh-pages -- needs the checkout's credentials left on disk for
  # later steps.
  - name: persistCredentials
    type: boolean
    default: false

steps:
  - checkout: self
    clean: true
    lfs: ${{ parameters.lfs }}
    persistCredentials: ${{ parameters.persistCredentials }}

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python-version)'

  - bash: |
      echo "=== Disk space before cleanup ==="
      df -h
      echo ""
      echo "=== Removing large pre-installed packages ==="
      sudo rm -rf /usr/share/dotnet || true
      sudo rm -rf /usr/local/lib/android || true
      sudo rm -rf /opt/ghc || true
      sudo rm -rf /opt/hostedtoolcache/CodeQL || true
      echo ""
      echo "=== Clearing apt cache ==="
      sudo apt-get clean || true
      sudo rm -rf /var/lib/apt/lists/* || true
      echo ""
      echo "=== Disk space after cleanup ==="
      df -h
    displayName: Free disk space

  - task: Cache@2
    inputs:
      key: 'pip | "$(python-version)" | poetry.lock'
      restoreKeys: |
        pip | "$(python-version)"
      path: $(Pipeline.Workspace)/.pip
    displayName: Cache pip packages

  - bash: |
      # Install poetry. Pinned deliberately, and the major matters: the lockfile
      # format is tied to it, and 1.8 cannot read the lock-version 2.1 file this
      # repository now commits, so a floating version here would break the moment
      # the installer moved on.
      #
      # 2.x is also what stops `poetry lock` re-resolving all 377 packages on
      # every run. Under 1.8 a release lock dragged unrelated upgrades along with
      # it -- 19 third-party packages in 2.10.0 and 113 in 2.9, none of them
      # reviewed as part of the release. 2.x preserves existing pins by default
      # and has no --no-update flag at all; --regenerate is the explicit opt-in.
      curl -sSL https://install.python-poetry.org | python3 - --version 2.3.2

      # Show python version
      echo "Using $(python --version) ($(which python))"
      poetry config virtualenvs.create false

      # Install one wheel at a time. On Python 3.10 and 3.11 the lock installs
      # two NCCL wheels that ship the same nvidia/nccl/lib/libnccl.so.2:
      # nvidia-nccl-cu12 for xgboost 3.2 (the last xgboost for those versions)
      # and nvidia-nccl-cu13 for torch. Poetry's parallel installer rewrites an
      # existing file in place, with no lock or temporary file, so when both
      # wheels write the library at once it can end up with bytes from each.
      # torch loads it on import, and that is the segfault that hits
      # test_huggingface_capabilities.py on the py310 and py311 jobs only.
      # Installed serially, the later wheel replaces the file whole.
      poetry config installer.parallel false

      # NOTE: workaround for langchain typecheck error
      # https://github.com/truera/trulens/issues/1308
      PIP_CACHE_DIR=$(Pipeline.Workspace)/.pip poetry run pip install pip==24.1.2

      poetry run python --version
      poetry run pip --version
    displayName: Env Setup
