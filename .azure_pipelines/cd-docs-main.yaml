# This is a definition for azure pipelines, not github pipelines. There are
# differences between these systems.
#
# Publishes the documentation site to the gh-pages branch when a release lands on
# main, so trulens.org reflects the latest released version rather than the tip of
# main.
#
# It also exists because deploying from a developer's laptop put 55 Git LFS
# pointer files on trulens.org in place of images. Every .png, .jpg and .gif in
# this repository is LFS-tracked, and a clone whose smudge filter is disabled
# leaves them on disk as ~130 byte text stubs. Nothing in the pipeline from there
# on objects: the build copies the stubs into site/, the deploy pushes them, and
# the server answers with HTTP 200, Content-Type: image/png and 130 bytes of
# pointer text. The bytes committed to git were correct the entire time. So the
# checkout here is LFS-aware, and a guard fails the run rather than publishing a
# stub if the problem ever returns by another route.
#
# Recognising a release is harder than it looks. Release branches are named
# releases/rc-trulens-<version>, but they are squash-merged, so the merge commit
# on main has a single parent and no record of the branch it came from -- only a
# PR number. The subjects are not a reliable pattern either ("TruLens 2.10.0"
# against "TruLens 2.9"). Release tags exist but sit on the rc branch rather than
# on main, and are pushed before the merge lands.
#
# What a release does leave on main is a version bump, across every pyproject.toml
# and meta.yaml. So the Gate job compares one line of src/core/pyproject.toml
# against the previous commit. That needs no token, no API call, and does not care
# how the branch was merged.

trigger:
  branches:
    include:
      - main
  # Deliberately no paths filter. A release is recognised by its version bump, not
  # by which files it happens to touch, and filtering on paths would also miss
  # releases whose only interesting change is a version. The Gate job is cheap
  # enough to run on every merge: it shallow-checks-out, compares one line, and
  # stops.

# Never run on a pull request. A PR must not be able to publish, and
# ci-docs-pr.yaml already builds the site in strict mode for review.
pr: none

jobs:
  - job: Gate
    displayName: "Decide whether a release landed"
    pool:
      vmImage: "ubuntu-latest"
    timeoutInMinutes: 10

    steps:
      - checkout: self
        clean: true
        # Two commits is all this job needs, and LFS would be wasted here: it
        # reads a single line of TOML and never opens an image.
        fetchDepth: 2
        lfs: false

      - bash: |
          set -euo pipefail

          VERSION_FILE=src/core/pyproject.toml

          # A manual run is the supported escape hatch for docs-only fixes between
          # releases, so it skips the check rather than being blocked by it.
          if [ "${BUILD_REASON:-}" = "Manual" ]; then
            echo "Build.Reason is Manual: publishing without looking for a version bump."
            echo "##vso[task.setvariable variable=shouldDeploy;isOutput=true]true"
            exit 0
          fi

          # fetchDepth: 2 should provide HEAD~1, but deepen rather than let a
          # missing object decide a release does not get published.
          git rev-parse --verify HEAD~1 >/dev/null 2>&1 || git fetch --deepen=1 origin

          curr=$(grep -m1 '^version' "$VERSION_FILE")
          prev=$(git show "HEAD~1:$VERSION_FILE" 2>/dev/null | grep -m1 '^version' || true)

          echo "previous: ${prev:-<unreadable>}"
          echo "current:  ${curr}"

          if [ -z "${prev}" ]; then
            # Publishing is the safer of the two failures here. A site briefly
            # ahead of the release is a smaller problem than one that silently
            # skips a release and stays behind until the next one.
            echo "Could not read the previous version. Publishing anyway."
            echo "##vso[task.setvariable variable=shouldDeploy;isOutput=true]true"
          elif [ "${prev}" = "${curr}" ]; then
            echo "Version unchanged: not a release. Nothing to publish."
            echo "##vso[task.setvariable variable=shouldDeploy;isOutput=true]false"
          else
            echo "Version bumped: a release landed. Publishing."
            echo "##vso[task.setvariable variable=shouldDeploy;isOutput=true]true"
          fi
        name: gate
        displayName: "Compare the core version against the previous commit"

  - job: DocsDeploy
    displayName: "Deploy Documentation"
    dependsOn: Gate
    condition: eq(dependencies.Gate.outputs['gate.shouldDeploy'], 'true')
    pool:
      vmImage: "ubuntu-latest"
    timeoutInMinutes: 30

    variables:
      # Snowflake libraries are not available on >=3.12. Matches ci-docs-pr.yaml,
      # which sets the same version through a single-entry matrix.
      python-version: "3.11"

    steps:
      - template: templates/env-setup.yaml
        parameters:
          lfs: true
          persistCredentials: true

      # Fails in milliseconds and before the build, so a bad checkout costs
      # nothing. Reads the working tree rather than the rendered site, which is
      # what lets it run this early.
      - bash: |
          make check-no-lfs-pointers
        displayName: "Fail if any doc asset is an LFS pointer"

      # Not --strict, on purpose. mkdocstrings resolves third-party inventories
      # over the network and answered HTTP 429 for typing-extensions during a
      # real deploy; under --strict that aborts the publish. Blocking a release's
      # docs on somebody else's rate limit is the wrong trade, and ci-docs-pr.yaml
      # already enforces --strict before merge, where a human can retry it.
      - bash: |
          set -euo pipefail
          git config user.name "azure-pipelines[bot]"
          git config user.email "azure-pipelines[bot]@users.noreply.github.com"
          poetry sync --with docs
          poetry run properdocs gh-deploy \
            --force \
            --message "Deployed {sha} from CI with ProperDocs {version}"
        displayName: "Build and publish to gh-pages"

      # The deploy is what makes the site, so verifying the artifact it just
      # pushed is the only check that speaks to what visitors will get. Reads from
      # the gh-pages branch rather than over HTTP, because GitHub Pages takes time
      # to serve a fresh commit and a poll loop here would be flaky.
      - bash: |
          set -euo pipefail
          git fetch origin gh-pages --depth 1
          rm -rf /tmp/ghp && mkdir -p /tmp/ghp
          git archive origin/gh-pages | tar -x -C /tmp/ghp
          python tools/check_no_lfs_pointers.py /tmp/ghp
        displayName: "Verify the published site carries real images"
