name: CLA

# Asks contributors to sign the Contributor License Agreement in /CLA.md, and
# records the signature.
#
# Signatures are stored on the unprotected `cla-signatures` branch. The CLA check
# is active but is not a required status check on `main`.
#
# HOW A CONTRIBUTOR SIGNS: the bot comments on their pull request with a link to
# the agreement. They reply with one comment containing exactly:
#
#   I have read the CLA Document and I hereby sign the CLA
#
# The bot records the signature in signatures/version1/cla.json on the
# cla-signatures branch and the check turns green. It is a one-time step; later
# pull requests from the same account pass without any action. No sign-up, no form,
# and nothing to do outside GitHub.
#
# IF A SIGNATURE IS MISSED: comment `recheck` on the pull request. The action
# re-reads every comment on the thread, so it will pick up a signature posted
# earlier, record it, and re-run the failed check. Confirm by looking for the
# account in signatures/version1/cla.json on the cla-signatures branch — that
# file, not the comment, is the signature of record.
#
# The action is pinned to the v2.6.1 commit. Upstream was archived in March 2026 and
# is read-only, so the pin cannot drift, but there will be no upstream fixes either.
# If that becomes a problem, fork it into the truera organization and change the
# `uses:` line; the contributor-facing flow is identical.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write # writes the signature file to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # The signature phrase is matched twice: here, to decide whether to run the
      # action at all, and again inside the action to decide whether a comment is
      # actually a signature. The action normalizes first — it compares
      # `body.trim().toLowerCase()` against the sign text — so a byte-exact `==`
      # gate is stricter than the check it guards. GitHub keeps a trailing CRLF on
      # some comment bodies, which made the gate miss, skipped the step, and left
      # the job reporting success: the run looked green while the signature was
      # never recorded, and the contributor saw a red check with no explanation.
      #
      # Normalize the same way the action does so the gate cannot be the stricter
      # of the two. The gate only decides whether to run; the action still makes
      # the real decision, so a false positive here costs one wasted run.
      - name: Classify the triggering comment
        id: trigger
        if: github.event_name == 'issue_comment'
        env:
          # Passed through env, never interpolated into the script: a comment body
          # is untrusted input and `${{ }}` inside `run:` would be an injection.
          COMMENT_BODY: ${{ github.event.comment.body }}
          # Keep in sync with `custom-pr-sign-comment` below.
          SIGN_TEXT: I have read the CLA Document and I hereby sign the CLA
        run: |
          python3 <<'PY'
          import os

          body = os.environ.get("COMMENT_BODY", "").strip().lower()
          sign = os.environ["SIGN_TEXT"].strip().lower()

          # The substring fallback keeps this gate looser than the action even if
          # SIGN_TEXT drifts from custom-pr-sign-comment.
          if body == sign or sign in body:
              kind = "sign"
          elif body == "recheck":
              kind = "recheck"
          else:
              kind = ""

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"kind={kind}\n")

          print(f"Comment classified as: {kind or 'not a CLA command'}")
          PY

      - name: CLA check
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event.issue.pull_request && steps.trigger.outputs.kind != '')
        # contributor-assistant/github-action@v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/truera/trulens/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          # Signatures live on their own branch of this repository, so there is no
          # second repository to create and no personal access token to store. The
          # branch must not be protected.
          branch: cla-signatures
          # Maintainers and bots are exempt. Bots cannot comment a signature, and
          # Snowflake employees contribute under their employment agreement.
          allowlist: bot*,dependabot[bot],github-actions[bot],A5Wagyu32,daniel-huang-1230,joshreini1,sfc-gh-*
          # Left unlocked after merge. The signature of record is the JSON file, not
          # the comment, so locking the conversation only stops people replying to
          # their own merged pull request.
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thanks for the contribution. Before we can merge it, we need a one-time
            signature on the TruLens Contributor License Agreement, which says that
            you wrote this or have the right to submit it, and that we may ship it
            under the project's licence.


            Please read the [CLA](https://github.com/truera/trulens/blob/main/CLA.md)
            and then post a comment on this pull request containing exactly:

            The TruLens standards checkbox is a separate certification and does
            not sign the CLA.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: >-
            All contributors have signed the CLA. Thanks — you will not be asked
            again on future pull requests.
