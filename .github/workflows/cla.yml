name: CLA

# Asks contributors to sign the Contributor License Agreement in /CLA.md, and
# records the signature.
#
# NOT YET IN FORCE. CLA.md needs Snowflake Legal approval first, and `CLA` should
# not be added to the required status checks on main until it has been approved.
#
# HOW A CONTRIBUTOR SIGNS: the bot comments on their pull request with a link to
# the agreement. They reply with one comment containing exactly:
#
#   I have read the CLA Document and I hereby sign the CLA
#
# The bot records the signature in signatures/version1/cla.json on the
# cla-signatures branch and the check turns green. It is a one-time step; later
# pull requests from the same account pass without any action. No sign-up, no form,
# and nothing to do outside GitHub.
#
# The action is pinned to the v2.6.1 commit. Upstream was archived in March 2026 and
# is read-only, so the pin cannot drift, but there will be no upstream fixes either.
# If that becomes a problem, fork it into the truera organization and change the
# `uses:` line; the contributor-facing flow is identical.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write # writes the signature file to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA check
        if: >-
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        # contributor-assistant/github-action@v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/truera/trulens/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          # Signatures live on their own branch of this repository, so there is no
          # second repository to create and no personal access token to store. The
          # branch must not be protected.
          branch: cla-signatures
          # Maintainers and bots are exempt. Bots cannot comment a signature, and
          # Snowflake employees contribute under their employment agreement.
          allowlist: bot*,dependabot[bot],github-actions[bot],A5Wagyu32,daniel-huang-1230,joshreini1,sfc-gh-*
          # Left unlocked after merge. The signature of record is the JSON file, not
          # the comment, so locking the conversation only stops people replying to
          # their own merged pull request.
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thanks for the contribution. Before we can merge it, we need a one-time
            signature on the TruLens Contributor License Agreement, which says that
            you wrote this or have the right to submit it, and that we may ship it
            under the project's licence.


            Please read $pathToCLADocument and then post a comment on this pull
            request containing exactly:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: >-
            All contributors have signed the CLA. Thanks — you will not be asked
            again on future pull requests.
