name: DCO

# Checks that the pull request description certifies the Developer Certificate of
# Origin in /DCO, via the checkbox in the pull request template.
#
# Runs on `edited` so that ticking the box re-runs the check, and on `synchronize`
# so that a passing status always corresponds to the current head commit rather
# than to whatever the pull request contained when the box was ticked.
#
# Uses `pull_request` rather than `pull_request_target`: this reads the description
# from the event payload and needs no token, so the read-only token given to fork
# pull requests is enough. No pull request code is executed.

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the certification
        env:
          # Via the environment, not interpolated into the run script, so that a
          # description containing shell metacharacters cannot affect the command.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python .github/scripts/check_dco.py --body "$PR_BODY"
