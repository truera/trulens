# Area reviewers — advisory review routing.
#
# WHY THIS FILE EXISTS, SEPARATELY FROM CODEOWNERS:
# GitHub silently ignores CODEOWNERS entries for accounts without write access.
# Area Triagers have the Triage role, not write, so they cannot be code owners — but
# they *can* be requested as reviewers, because review requests only require
# read access. This file is the routing table for those advisory requests.
#
# Two mechanisms, two files:
#   .github/CODEOWNERS          -> Area Reviewers and Maintainers. Blocking.
#   .github/area-reviewers.yml  -> Area Triagers. Advisory, non-blocking.
#
# When an Area Triager is promoted to Area Reviewer, move them from here into
# CODEOWNERS in the same PR that grants scoped write access.
#
# PATH MATCHING: prefixes and exact paths only, matched against each changed
# file. A pattern ending in "/" matches everything beneath that directory. An
# optional `exclude:` list carves out paths owned by someone else. No wildcards —
# the predictability is deliberate, since this file routes review requests to
# people rather than gating merges.
#
# Areas may overlap. A PR touching several gets a request from each, which is
# intended: overlapping areas are how someone gains exposure outside their own.
#
# See CONTRIBUTOR_LADDER.md for how areas are assigned.

# Reviewers are commented out until each nomination is accepted and the Triage
# role is granted. Uncomment in the same PR that adds them to MAINTAINERS.md.

areas:
  - name: Core
    # The largest area in the repo and the one with the thinnest review
    # coverage, so it is deliberately routed to the whole cohort rather than to
    # one owner. The goal is exposure: core is where reviewers need experience
    # before they can own anything in it.
    paths:
      - src/core/
    reviewers: []
    # reviewers: [Payal2000, bashward, debu-sinha, desusaiteja,
    #             maitraymukeshkumarmodi-aiml, nuthalapativarun]

  - name: Documentation
    paths:
      - docs/
      - mkdocs.yml
      - README.md
    reviewers: []
    # reviewers: [aqilaziz, nuthalapativarun]

  - name: OpenTelemetry semantic conventions
    paths:
      - src/otel/
    reviewers: []
    # reviewers: [nuthalapativarun]

  - name: Feedback functions
    paths:
      - src/feedback/
    reviewers: []
    # reviewers: [debu-sinha]

  - name: Feedback templates
    paths:
      - src/feedback/trulens/feedback/templates/
    reviewers: []
    # reviewers: [maitraymukeshkumarmodi-aiml]

  - name: Ensemble and prompt optimization
    paths:
      - src/apps/gepa/
      - src/feedback/trulens/feedback/optimize.py
    reviewers: []
    # reviewers: [bashward]

  - name: LLM judge alignment
    paths:
      - src/benchmark/trulens/benchmark/alignment_report.py
      - src/benchmark/trulens/benchmark/cross_model_alignment.py
      - src/benchmark/trulens/benchmark/criteria_ab_test.py
      - src/benchmark/trulens/benchmark/score_distribution.py
      - docs/component_guides/evaluation/llm_judge_alignment.md
    reviewers: []
    # reviewers: [debu-sinha]

  - name: Benchmarking and golden sets
    paths:
      - src/benchmark/
    reviewers: []
    # reviewers: [maitraymukeshkumarmodi-aiml]

  - name: Offline and batch evaluation
    paths:
      - src/core/trulens/core/batch.py
      - src/benchmark/trulens/benchmark/golden_set_generator.py
    reviewers: []
    # reviewers: [desusaiteja]

  - name: Runs and online evaluation sampling
    paths:
      - src/core/trulens/core/run.py
      - src/core/trulens/core/sampling.py
    reviewers: []
    # reviewers: [Payal2000]

  - name: Providers
    # All provider integrations except Cortex. Siddharth authored the
    # Google/Gemini provider; the area is the whole provider surface because the
    # integrations share plumbing and the same failure modes recur across them.
    # Cortex is excluded: it is Snowflake's own provider and the busiest of the
    # eight, so it stays with maintainers.
    paths:
      - src/providers/
    exclude:
      - src/providers/cortex/
    reviewers: []
    # reviewers: [sahusiddharth]
